<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>Matemática ENEM — Apostila Interativa</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#0b1020;color:#f3f6fb}
    .boot{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 70% 20%,rgba(110,214,255,.10),transparent 28rem),#0b1020}
    .boot-card{width:min(560px,100%);padding:28px;border:1px solid #283652;border-radius:22px;background:#11182b;box-shadow:0 24px 80px rgba(0,0,0,.25)}
    .brand{display:flex;gap:13px;align-items:center;margin-bottom:24px}.mark{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:#6ed6ff;color:#07111d;font-size:24px;font-weight:800}
    h1{font-size:24px;margin:0 0 7px}p{color:#9ca8bd;line-height:1.6;margin:0}.progress{height:8px;margin:24px 0 10px;border-radius:99px;background:#202d47;overflow:hidden}.bar{height:100%;width:78%;background:#6ed6ff;border-radius:99px;animation:load 1.2s ease-in-out infinite alternate}.status{font-size:12px;color:#9ca8bd}
    @keyframes load{from{width:18%}to{width:92%}}
  </style>
</head>
<body>
  <main class="boot">
    <section class="boot-card">
      <div class="brand"><div class="mark">Σ</div><div><h1>Apostila Interativa ENEM</h1><p>Carregando a versão completa v6…</p></div></div>
      <div class="progress"><div class="bar"></div></div>
      <div class="status">Inicializando fórmulas, experimentos visuais e banco ENEM 2009–2025…</div>
    </section>
  </main>

  <script>window.__SITE_B64="";</script>

  <script src="payload/chunk-02.js"></script>
  <script src="payload/chunk-03.js"></script>
  <script src="payload/chunk-04a.js"></script>
  <script src="payload/chunk-04b.js"></script>
  <script src="payload/chunk-05b.js"></script>
  <script src="payload/chunk-06.js"></script>
  <script src="payload/chunk-07.js"></script>
  <script src="payload/chunk-08.js"></script>
  <script src="payload/chunk-09.js"></script>
  <script src="payload/chunk-10.js"></script>
  <script src="payload/boot.js"></script>
</body>
</html>
