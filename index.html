<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Protótipo de apostila digital interativa de Matemática para o ENEM." />
  <title>Matemática ENEM — Apostila Interativa</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    window.MathJax = {
      tex: {inlineMath: [['\\(','\\)'], ['$', '$']], displayMath: [['\\[','\\]']]},
      svg: {fontCache: 'global'},
      options: {skipHtmlTags: ['script','noscript','style','textarea','pre','code']}
    };
  </script>
  <script async id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">Σ</div>
        <div>
          <strong>Matemática ENEM</strong>
          <small>Apostila interativa</small>
        </div>
      </div>

      <nav class="family-nav" aria-label="Famílias de conteúdo">
        <button class="nav-item active" data-family="geometria"><span>01</span>Geometria e medidas</button>
        <button class="nav-item" data-family="graficos"><span>02</span>Gráficos e tabelas</button>
        <button class="nav-item" data-family="proporcao"><span>03</span>Proporcionalidade</button>
        <button class="nav-item" data-family="unidades"><span>04</span>Unidades e conversões</button>
        <button class="nav-item" data-family="estatistica"><span>05</span>Estatística</button>
        <button class="nav-item" data-family="funcoes"><span>06</span>Funções e álgebra</button>
        <button class="nav-item" data-family="probabilidade"><span>07</span>Probabilidade</button>
      </nav>

      <div class="sidebar-footer">
        <div class="progress-ring" id="globalProgress">0%</div>
        <div>
          <strong>Seu progresso</strong>
          <small id="progressText">0 de 765 questões respondidas</small>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Abrir menu">☰</button>
        <div class="top-title">
          <small>BANCO REAL · V6 · EXPERIMENTOS VISUAIS</small>
          <strong id="topFamilyTitle">Geometria e medidas</strong>
        </div>
        <div class="score">
          <span id="scoreHits">0</span>/<span id="scoreSeen">0</span>
          <small>acertos</small>
        </div>
      </header>

      <section id="content"></section>
    </main>
  </div>

  <template id="family-template">
    <article class="family-page">
      <section class="hero">
        <div>
          <span class="eyebrow" data-eyebrow></span>
          <h1 data-title></h1>
          <p data-intro></p>
          <div class="hero-actions">
            <button class="primary" data-scroll="handbook">Abrir apostila</button>
            <button class="secondary" data-scroll="questions">Ir para questões</button>
          </div>
        </div>
        <div class="hero-stat">
          <span data-count></span>
          <small>questões no filtro atual</small>
        </div>
      </section>

      <section class="section lesson-section" id="lesson">
        <div class="section-heading">
          <span class="section-number">01</span>
          <div>
            <h2>Entenda a ideia</h2>
            <p data-context></p>
          </div>
        </div>
        <div class="concept-grid" data-concepts></div>
        <div class="subtopic-panel">
          <div class="subtopic-head">
            <strong>Mapa de microconteúdos</strong>
            <span>Use estes tópicos também como filtro no banco.</span>
          </div>
          <div class="subtopic-grid" data-subtopics></div>
        </div>
      </section>

      <section class="section pattern-section" id="patterns">
        <div class="section-heading">
          <span class="section-number">02</span>
          <div>
            <h2>Como interpretar e reconhecer os padrões</h2>
            <p>Aprenda a identificar a arquitetura da questão antes de começar a calcular.</p>
          </div>
        </div>
        <div class="decoder-box" data-decoder></div>
        <div class="case-toolbar">
          <div>
            <strong>Casos canônicos desta família</strong>
            <span>O contexto muda; a rota matemática se repete.</span>
          </div>
        </div>
        <div class="case-grid" data-cases></div>
      </section>

      <section class="section visual-proof-section" id="visual-proofs">
        <div class="section-heading">
          <span class="section-number">03</span>
          <div>
            <h2>Experimentos visuais</h2>
            <p>Preveja → manipule → descubra → demonstre → pratique no ENEM.</p>
          </div>
        </div>
        <div class="visual-proof-intro">
          <span class="badge">Aprendizagem ativa</span>
          <p>Escolha uma relação matemática. Primeiro faça uma previsão; depois os controles são liberados para você investigar o padrão.</p>
        </div>
        <div class="experiment-picker" data-experiment-picker></div>
        <div class="experiment-stage" data-experiment-stage></div>
      </section>

      <section class="section handbook-section" id="handbook">
        <div class="section-heading">
          <span class="section-number">04</span>
          <div>
            <h2>Apostila-resumo</h2>
            <p>Teoria em capítulos, exemplos resolvidos, fórmulas e armadilhas recorrentes.</p>
          </div>
        </div>
        <div class="learning-objectives" data-objectives></div>
        <div class="study-route" data-study-route></div>
        <div class="chapter-list" data-chapters></div>
        <div data-special-content></div>
        <div class="exam-guide" data-exam-guide></div>
      </section>

      <section class="section interactive-section">
        <div class="section-heading">
          <span class="section-number">05</span>
          <div>
            <h2>Explore interativamente</h2>
            <p>Altere parâmetros, teste conjecturas e observe o que muda.</p>
          </div>
        </div>
        <div data-interactive></div>
      </section>

      <section class="section quickcheck-section">
        <div class="section-heading">
          <span class="section-number">06</span>
          <div>
            <h2>Cheque sua compreensão</h2>
            <p>Atividades curtas com feedback imediato.</p>
          </div>
        </div>
        <div data-activity></div>
      </section>

      <section class="section question-section" id="questions">
        <div class="section-heading">
          <span class="section-number">07</span>
          <div>
            <h2>Banco de questões</h2>
            <p>Questões reais de Matemática do ENEM, com filtro por ano, correção e conferência da fonte.</p>
          </div>
        </div>

        <div class="bank-status" id="bankStatus" aria-live="polite">
          <strong>Banco real conectado</strong>
          <span>Selecione um ano. “Todos os anos” carrega e classifica o corpus 2009–2025.</span>
        </div>

        <div class="question-toolbar">
          <label>
            <span>Ano</span>
            <select id="questionYear">
              <option value="2025">2025</option>
              <option value="2024">2024</option>
              <option value="2023">2023</option>
              <option value="2022">2022</option>
              <option value="2021">2021</option>
              <option value="2020">2020</option>
              <option value="2019">2019</option>
              <option value="2018">2018</option>
              <option value="2017">2017</option>
              <option value="2016">2016</option>
              <option value="2015">2015</option>
              <option value="2014">2014</option>
              <option value="2013">2013</option>
              <option value="2012">2012</option>
              <option value="2011">2011</option>
              <option value="2010">2010</option>
              <option value="2009">2009</option>
              <option value="all">Todos os anos (765)</option>
            </select>
          </label>
          <label>
            <span>Subtema</span>
            <select id="questionSubtopic">
              <option value="all">Todos os subtemas</option>
            </select>
          </label>
          <label>
            <span>Caso</span>
            <select id="questionCase">
              <option value="all">Todos os casos</option>
            </select>
          </label>
          <label>
            <span>Exibir</span>
            <select id="questionMode">
              <option value="all">Todas no filtro</option>
              <option value="random">Aleatórias</option>
              <option value="specific">Questão específica</option>
            </select>
          </label>
          <label id="randomCountWrap" class="hidden">
            <span>Quantidade</span>
            <input id="randomCount" type="number" min="1" max="50" value="5" />
          </label>
          <label id="specificIdWrap" class="hidden">
            <span>Número original</span>
            <input id="specificId" type="number" min="136" max="180" value="136" />
          </label>
          <button class="primary" id="applyQuestionFilter">Carregar</button>
        </div>

        <div id="questionList" class="question-list"></div>
      </section>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
